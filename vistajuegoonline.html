<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Neon Co-op Online</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:'Courier New', monospace; }
        canvas { display:block; cursor:crosshair; }
        .hidden { display:none !important; }
        #lobby-container { position:absolute; top:0; left:0; width:100%; height:100%; background:#000; display:flex; justify-content:center; align-items:center; z-index:300; }
        .box { border:4px solid #fff; padding:30px; text-align:center; width:380px; }
        input, button { width:90%; padding:12px; margin:8px 0; font-weight:bold; font-size:16px; font-family:'Courier New'; border:2px solid #fff; background:#000; color:#fff; }
        input { border-color:#444; color:#00f2ff; text-align:center; }
        button:hover { background:#fff; color:#000; cursor:pointer; }
        #ranking-list { list-style:none; padding:0; text-align:left; color:#0f0; font-size:14px; margin-top:10px; }
        #game-ui { position:absolute; top:20px; left:20px; pointer-events:none; }
    </style>
</head>
<body>

    <div id="lobby-container">
        <div id="main-menu" class="box">
            <h1 style="color:#00f2ff; margin-bottom:20px;">NEON CO-OP</h1>
            <input type="text" id="username" placeholder="TU NOMBRE" maxlength="12">
            <button onclick="createRoom()">CREAR SALA</button>
            <input type="text" id="roomCode" placeholder="CÓDIGO SALA">
            <button onclick="joinRoom()">UNIRSE</button>
            <div style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
                <h3 style="color:#ffd700;">TOP 5 MUNDIAL</h3>
                <ul id="ranking-list"><li>Cargando ranking...</li></ul>
            </div>
        </div>
        <div id="wait-menu" class="box hidden">
            <h2 style="color:#ff00ff;">SALA: <span id="display-code"></span></h2>
            <button id="btn-start" class="hidden" onclick="startGame()">INICIAR</button>
            <button onclick="location.reload()">SALIR</button>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div>SECTOR: <span id="lvl-txt" style="color:#00f2ff">1</span></div>
        <div>PUNTOS: <span id="score-txt" style="color:#ffd700">0</span></div>
        <div>VIDAS: <span id="lives-txt" style="color:#ff0077"></span></div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let mouse={x:0,y:0}, keys={}, isShooting=false, scoreSaved=false, localPlayer=null;

        function createRoom() { socket.emit('createRoom'); }
        function joinRoom() { socket.emit('joinRoom', document.getElementById('roomCode').value.toUpperCase()); }
        function startGame() { socket.emit('startGame', document.getElementById('display-code').innerText); }

        socket.on('roomCreated', c => showWait(c, true));
        socket.on('joinedRoom', c => showWait(c, false));
        socket.on('youAreHost', () => document.getElementById('btn-start').classList.remove('hidden'));
        socket.on('receiveRanking', data => {
            document.getElementById('ranking-list').innerHTML = data.map((s,i)=>`<li>${i+1}. ${s.username} - ${s.score}</li>`).join('');
        });

        function showWait(c, host) {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('wait-menu').classList.remove('hidden');
            document.getElementById('display-code').innerText = c;
            if(host) document.getElementById('btn-start').classList.remove('hidden');
        }

        socket.on('gameStarted', () => {
            document.getElementById('lobby-container').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            canvas.classList.remove('hidden');
        });

        window.addEventListener('mousemove', e => { 
            const r = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - r.left) * (1200 / r.width); mouse.y = (e.clientY - r.top) * (800 / r.height);
        });
        window.addEventListener('mousedown', () => isShooting = true);
        window.addEventListener('mouseup', () => isShooting = false);
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        setInterval(() => {
            if(!localPlayer) return;
            socket.emit('playerInput', { keys, angle: Math.atan2(mouse.y-localPlayer.y, mouse.x-localPlayer.x), isShooting });
        }, 1000/60);

        socket.on('gameState', (room) => {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,1200,800);
            localPlayer = room.players[socket.id];
            if (localPlayer) {
                document.getElementById('lvl-txt').innerText = room.level;
                document.getElementById('score-txt').innerText = room.score;
                document.getElementById('lives-txt').innerText = "▲ ".repeat(Math.max(0, localPlayer.lives));
                if (localPlayer.lives <= 0 && !scoreSaved) {
                    socket.emit('saveScore', { name: document.getElementById('username').value || "PILOTO", score: room.score });
                    scoreSaved = true;
                    alert("GAME OVER. PUNTOS GUARDADOS.");
                    location.reload();
                }
            }
            for (let a of room.asteroids) {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
                for(let j=0; j<a.vert; j++) {
                    let ang = (j / a.vert) * Math.PI * 2; ctx.lineTo(a.x + Math.cos(ang) * a.r * a.offsets[j], a.y + Math.sin(ang) * a.r * a.offsets[j]);
                }
                ctx.closePath(); ctx.stroke();
            }
            for (let l of room.lasers) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(l.x, l.y, 2, 0, 7); ctx.fill(); }
            for (let id in room.players) {
                let p = room.players[id]; if (p.lives <= 0) continue;
                ctx.strokeStyle = (id === socket.id) ? '#00f2ff' : '#fff';
                ctx.lineWidth = 2; ctx.beginPath();
                ctx.moveTo(p.x + Math.cos(p.angle)*15, p.y + Math.sin(p.angle)*15);
                ctx.lineTo(p.x + Math.cos(p.angle+2.4)*12, p.y + Math.sin(p.angle+2.4)*12);
                ctx.lineTo(p.x + Math.cos(p.angle-2.4)*12, p.y + Math.sin(p.angle-2.4)*12);
                ctx.closePath(); ctx.stroke();
            }
        });
        socket.emit('getRanking');
    </script>
</body>
</html>
